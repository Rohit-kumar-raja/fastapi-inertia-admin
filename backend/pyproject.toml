[project]
name = "inertia-backend-admin"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic[email]>=2.7.1",
    "itsdangerous>=2.2.0",
    "fastapi-inertia>=1.0.1",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.44",
    "fpcli>=0.1.41",
    "pydantic-settings>=2.12.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.10.1",
    "fp-datatables>=0.1.2",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.20",
    "alembic>=1.17.2",
    "pywebpush>=2.0.0",
    "cryptography>=42.0.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3"
]
